<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2C230">
<title>Qui de nous…</title>
<meta name="description" content="Le jeu de soirée : une question, chacun vote en secret sur son téléphone, le verdict tombe.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qui de nous">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.code{font-family:var(--display);font-size:clamp(44px,15vw,64px);line-height:1;letter-spacing:.12em;color:var(--accent);font-variant-numeric:tabular-nums}
input.codein{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-weight:700;font-size:14px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.25}
.panel.alert{border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
.chip .tag.off{background:transparent;color:var(--ink-2);border:1.5px solid var(--ink-2)}
/* theme pills */
.pill{border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font:700 14px var(--body);padding:7px 12px;cursor:pointer}
.pill small{font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.pill:focus-visible,.swatch:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* house questions waiting for approval */
.customs li.wait-ok{border:2px dashed var(--ink-2)}
.customs .tagline{display:block;font-size:12px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.customs .acts{display:flex;gap:4px;flex:none}
/* timers */
.timer{display:flex;flex-direction:column;gap:6px}
.timer .tl{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums}
.timer .tl b{font-family:var(--display);font-weight:400;font-size:20px}
.timer .bar i{background:var(--ink);transition:width 1s linear}
.timer.hurry .tl b{color:var(--accent)}
.timer.hurry .bar i{background:var(--accent)}
.defense .count{font-family:var(--display);font-size:clamp(56px,18vw,96px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
/* gage / truth */
.gage{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--ink-2);padding-top:12px}
.gage:first-of-type{border-top:none;padding-top:0}
.gage .gk{font:800 13px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.gage p{margin:0;font:800 clamp(19px,5.4vw,24px)/1.25 var(--body);text-wrap:balance}
.gage.dare p{color:var(--accent)}
/* pause */
.pause{padding-block:36px}
.pause .big{font-family:var(--display);font-size:clamp(28px,8vw,40px);line-height:1.1}
/* titles in the leaderboard */
.rank .title{display:inline-block;align-self:flex-start;font:800 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--card);border-radius:999px;padding:4px 9px;margin:3px 0}
.rank li:first-child .title{background:var(--on-accent);color:var(--accent)}
/* profile */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats li{background:var(--card-2);border-radius:12px;padding:10px 4px;font-size:13px;color:var(--ink-2)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink)}
/* QR code (always dark on white so phones can read it) */
.qr{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px;width:min(240px,70vw);aspect-ratio:1;max-width:100%}
.qr svg{display:block;width:100%;height:100%}
.qr.big{width:min(340px,40vw)}
.tvbox{width:100%;text-align:left}
.tvbox summary{cursor:pointer;font-weight:700;padding:6px 0}
.tvbox .row input{font-size:14px}
/* big screen: same game, sized for a TV across the room */
body.tv .wrap{max-width:1200px;gap:28px}
body.tv .logo{font-size:56px}
body.tv .qcard .who{font-size:34px}
body.tv .qcard .q{font-size:clamp(36px,4.6vw,64px)}
body.tv .verdict .name{font-size:clamp(56px,7vw,96px)}
body.tv .chip{font-size:22px}
body.tv .chip .av{width:40px;height:40px;font-size:18px}
body.tv .res .line{font-size:24px}
body.tv .gage p{font-size:clamp(26px,3vw,40px)}
.tvrow{display:flex;gap:32px;align-items:center;justify-content:center;flex-wrap:wrap}
</style>
<style>
/* Retour au hub « Ce soir on joue » */
.hub-back{max-width:520px;margin:0 auto;padding:10px 16px 0}
.hub-back a{display:inline-flex;align-items:center;gap:6px;font:700 14px/1 var(--body,system-ui,sans-serif);color:var(--ink,currentColor);background:var(--card,transparent);border:2px solid var(--ink,currentColor);border-radius:999px;padding:8px 13px;text-decoration:none}
.hub-back a:focus-visible{outline:3px solid var(--accent,currentColor);outline-offset:3px}
body.tv .hub-back{display:none}
</style>
</head>
<body>
<nav class="hub-back" aria-label="Autres jeux"><a href="../">← Tous nos jeux</a></nav>
<div class="wrap" id="app"><header class="top big"><h1 class="logo">Qui de nous<span class="num">…</span></h1></header><section class="panel center loading">Ouverture de la boîte…</section></div>
<script type="module" src="app.js"></script>
</body>
</html>
