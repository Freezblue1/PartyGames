<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE3">
<title>Photo Roulette</title>
<meta name="description" content="Le jeu de soirée : une photo tirée de vos galeries, à qui est-elle ? Chacun joue sur son téléphone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E5432A'/%3E%3Crect x='14' y='10' width='36' height='44' rx='3' fill='%23FFFDF8' transform='rotate(-6 32 32)'/%3E%3Crect x='18' y='14' width='28' height='26' fill='%231C1714' transform='rotate(-6 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;700;800&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Retour au hub « Ce soir on joue » */
.hub-back{max-width:520px;margin:0 auto;padding:10px 16px 0}
.hub-back a{display:inline-flex;align-items:center;gap:6px;font:700 14px/1 var(--body,system-ui,sans-serif);color:var(--ink,currentColor);background:var(--card,transparent);border:2px solid var(--ink,currentColor);border-radius:999px;padding:8px 13px;text-decoration:none}
.hub-back a:focus-visible{outline:3px solid var(--accent,currentColor);outline-offset:3px}
body.tv .hub-back{display:none}
</style>
</head>
<body>
<nav class="hub-back" aria-label="Autres jeux"><a href="../">← Tous nos jeux</a></nav>
<div class="wrap" id="app"><header class="top big"><h1 class="logo">Photo<span class="tape">Roulette</span></h1></header><section class="panel center loading">Développement en cours…</section></div>
<!-- Hors de #app : le sélecteur de photos survit aux mises à jour de l'écran pendant qu'il est ouvert. -->
<input id="picker" class="vh" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input id="folder" class="vh" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">
<div id="lb" class="lb" hidden><img alt=""><p></p></div>
<script type="module" src="app.js"></script>
</body>
</html>
