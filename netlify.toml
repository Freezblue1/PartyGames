[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Server code is not meant to be served as a page
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Tests are not part of the site either
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
